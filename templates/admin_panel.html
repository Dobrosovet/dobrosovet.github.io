<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ Панель</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Админ Панель</h1>
        </header>

        <!-- Секция отзывов -->
        <section class="reviews-section">
            <h2>Отзывы</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Текст</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {% for review in reviews %}
                        <tr id="review-{{ review.id }}">
                            <td>{{ review.name }}</td>
                            <td>{{ review.text }}</td>
                            <td>
                                <div class="actions">
                                    <form action="{{ url_for('admin_delete_review', review_id=review.id) }}" method="post" class="delete-form">
                                        <button type="submit" class="btn btn-danger" data-review-id="{{ review.id }}">Удалить</button>
                                    </form>
                                    <form action="{{ url_for('admin_ban_user', user_id=review.user_id) }}" method="post">
                                        <button type="submit" class="btn btn-warning">Заблокировать</button>
                                    </form>
                                    <form action="{{ url_for('admin_unban_user', user_id=review.user_id) }}" method="post">
                                        <button type="submit" class="btn btn-success">Разблокировать</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>

        <!-- Секция заблокированных пользователей -->
        <section class="banned-users-section">
            <h2>Заблокированные пользователи</h2>
            <ul class="banned-users-list">
                {% for user in banned_users %}
                    <li>
                        <span>{{ user.name }}</span>
                        <form action="{{ url_for('admin_unban_user', user_id=user.id) }}" method="post">
                            <button type="submit" class="btn btn-success">Разблокировать</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </section>
    </div>

    <script>
        $(document).ready(function() {
            $('.delete-form').on('submit', function(e) {
                e.preventDefault(); // Останавливаем обычную отправку формы
                var button = $(this).find('button');
                var reviewId = button.data('review-id');
                
                // Отправляем AJAX-запрос на удаление отзыва
                $.ajax({
                    type: 'POST',
                    url: $(this).attr('action'),
                    data: $(this).serialize(),
                    success: function(response) {
                        if (response.error) {
                            alert(response.error); // Покажем ошибку, если она есть
                        } else {
                            // Удаляем строку отзыва из таблицы
                            $('#review-' + reviewId).fadeOut();
                        }
                    },
                    error: function() {
                        alert('Произошла ошибка при удалении отзыва.');
                    }
                });
            });
        });
    </script>
</body>
</html>
